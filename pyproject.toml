[project]
name = "dsa-server"
version = "0.1.8"
description = "Stock Intelligent Analysis System — CLI + MCP Server + REST API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["stock", "finance", "analysis", "dsa", "trading"]
authors = [
    {name = "kuaizhongqiang"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
]
[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
full = [
    "akshare",
    "tushare",
    "baostock",
    "yfinance",
    "pytdx",
    "litellm",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pandas",
    "numpy",
    "requests",
    "beautifulsoup4",
    "lxml",
    "jieba",
    "sentencepiece",
    "openpyxl",
]

[project.urls]
Homepage = "https://github.com/kuaizhongqiang/daily_stock_analysis"
Repository = "https://github.com/kuaizhongqiang/daily_stock_analysis"

[tool.setuptools.packages.find]
include = ["dsa*", "src*", "data_provider*", "api*", "strategies*"]
exclude = ["tests*", "extensions*"]

[tool.setuptools]
py-modules = ["server"]
include-package-data = true

[tool.setuptools.package-data]
dsa = ["templates/*.yaml", "SKILL.md"]
src = ["py.typed"]

[project.scripts]
dsa = "dsa.cli:main"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".git", "__pycache__", ".env", "venv", ".venv"]

[tool.bandit]
exclude_dirs = ["tests", "test_*.py"]
skips = ["B101"]  # assert 语句在测试中是允许的
