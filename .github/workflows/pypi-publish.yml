# PyPI Publish — tag 触发，发布 dsa-server 到 PyPI 并创建 GitHub Release

name: PyPI Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: 🐍 PyPI publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 用于创建 Release

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 Install build tools
        run: pip install build twine

      - name: 🔨 Build wheel + sdist
        run: python -m build

      - name: 📤 Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --disable-progress-bar dist/*

      - name: 🏷️ Create GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "See [CHANGELOG](https://github.com/kuaizhongqiang/daily_stock_analysis/blob/${TAG}/docs/CHANGELOG.md) for details." \
            --target main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
