# CI — PR / push 时自动运行 lint + test + build
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 📦 Install lint dependencies
        run: pip install flake8
      - name: ✅ Python syntax check
        run: |
          python -m py_compile dsa/cli.py server.py
          python -m py_compile dsa/commands/*.py
          python -m py_compile data_provider/*.py
      - name: ✅ Flake8 critical checks
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest tenacity python-multipart
          pip install -e ".[full]"
      - name: ✅ Offline unit tests
        run: python -m pytest -v --tb=short

  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 📦 Install build tools
        run: pip install build
      - name: 🔨 Build wheel + sdist
        run: python -m build
      - name: 💾 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
